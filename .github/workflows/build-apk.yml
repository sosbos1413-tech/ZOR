name: Build APK

# Builds an installable Android APK that bundles the game as an offline asset.
# Runs on every push so the APK is downloadable without merging anything first.
on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'android/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Bundle the game into the app's assets
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/hideout.html
          ls -la android/app/src/main/assets/

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug

      - name: Stage the APK under a friendly name
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/HIDEOUT.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HIDEOUT-apk
          path: output/HIDEOUT.apk
          if-no-files-found: error
